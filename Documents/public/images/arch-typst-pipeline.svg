<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 351.65999999999997 490.3" width="351.65999999999997" height="490.3" style="--bg:#1F1F1F;--fg:#CCCCCC;--line:#CCCCCC;--accent:#0078D4;--muted:#CCCCCCCC;--surface:#181818;--border:#CCCCCC;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<polyline class="edge" data-from="Author" data-to="Backend" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="175.82999999999998,76.9 175.82999999999998,124.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Backend" data-to="API" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="175.82999999999998,178.70000000000002 175.82999999999998,226.70000000000002" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="API" data-to="Typlet" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="175.82999999999998,263.6 175.82999999999998,311.6" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Typlet" data-to="Render" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="175.82999999999998,348.5 175.82999999999998,396.5" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<g class="node" data-id="Author" data-label="1. 编者输入 Typst 纯文本" data-shape="rectangle">
  <rect x="79.64349999999999" y="40" width="192.373" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="175.82999999999998" y="58.45" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">1. 编者输入 Typst 纯文本</text>
</g>
<g class="node" data-id="Backend" data-label="2. 后端校验并存入 DB
(计算 SHA-256 source_hash)" data-shape="rectangle">
  <rect x="67.7875" y="124.9" width="216.08499999999998" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="175.82999999999998" y="151.8" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="175.82999999999998" dy="-3.9000000000000012">2. 后端校验并存入 DB</tspan><tspan x="175.82999999999998" dy="16.900000000000002">(计算 SHA-256 source_hash)</tspan></text>
</g>
<g class="node" data-id="API" data-label="3. API 下发纯文本源码至前端" data-shape="rectangle">
  <rect x="62.97099999999999" y="226.70000000000002" width="225.718" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="175.82999999999998" y="245.15000000000003" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">3. API 下发纯文本源码至前端</text>
</g>
<g class="node" data-id="Typlet" data-label="4. 前端 Typlet WASM 编译器增量解析" data-shape="rectangle">
  <rect x="40" y="311.6" width="271.65999999999997" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="175.82999999999998" y="330.05" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">4. 前端 Typlet WASM 编译器增量解析</text>
</g>
<g class="node" data-id="Render" data-label="5. 浏览器原生高保真矢量排版直出
(SVG / Canvas 无限缩放)" data-shape="rectangle">
  <rect x="44.81650000000002" y="396.5" width="262.02699999999993" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="175.82999999999998" y="423.4" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="175.82999999999998" dy="-3.9000000000000012">5. 浏览器原生高保真矢量排版直出</tspan><tspan x="175.82999999999998" dy="16.900000000000002">(SVG / Canvas 无限缩放)</tspan></text>
</g>
</svg>