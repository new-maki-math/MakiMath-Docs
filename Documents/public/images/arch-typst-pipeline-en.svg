<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 376.8539999999999 490.3" width="376.8539999999999" height="490.3" style="--bg:#1F1F1F;--fg:#CCCCCC;--line:#CCCCCC;--accent:#0078D4;--muted:#CCCCCCCC;--surface:#181818;--border:#CCCCCC;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<polyline class="edge" data-from="Author" data-to="Backend" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="188.42699999999996,76.9 188.42699999999996,124.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Backend" data-to="API" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="188.42699999999996,178.70000000000002 188.42699999999996,226.70000000000002" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="API" data-to="Typlet" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="188.42699999999996,263.6 188.42699999999996,311.6" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Typlet" data-to="Render" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="188.42699999999996,348.5 188.42699999999996,396.5" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<g class="node" data-id="Author" data-label="1. Author writes raw Typst source" data-shape="rectangle">
  <rect x="71.49249999999996" y="40" width="233.869" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="188.42699999999996" y="58.45" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">1. Author writes raw Typst source</text>
</g>
<g class="node" data-id="Backend" data-label="2. Backend validates &amp; stores in DB
(Computes SHA-256 source_hash)" data-shape="rectangle">
  <rect x="65.19399999999997" y="124.9" width="246.46599999999998" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="188.42699999999996" y="151.8" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="188.42699999999996" dy="-3.9000000000000012">2. Backend validates &amp; stores in DB</tspan><tspan x="188.42699999999996" dy="16.900000000000002">(Computes SHA-256 source_hash)</tspan></text>
</g>
<g class="node" data-id="API" data-label="3. API delivers raw source to client" data-shape="rectangle">
  <rect x="67.41699999999997" y="226.70000000000002" width="242.01999999999998" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="188.42699999999996" y="245.15000000000003" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">3. API delivers raw source to client</text>
</g>
<g class="node" data-id="Typlet" data-label="4. Typlet WASM compiler parses in browser" data-shape="rectangle">
  <rect x="40" y="311.6" width="296.8539999999999" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="188.42699999999996" y="330.05" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">4. Typlet WASM compiler parses in browser</text>
</g>
<g class="node" data-id="Render" data-label="5. Native vector typesetting mounted to DOM
(Flawless SVG / Canvas scaling)" data-shape="rectangle">
  <rect x="41.852499999999964" y="396.5" width="293.149" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="188.42699999999996" y="423.4" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="188.42699999999996" dy="-3.9000000000000012">5. Native vector typesetting mounted to DOM</tspan><tspan x="188.42699999999996" dy="16.900000000000002">(Flawless SVG / Canvas scaling)</tspan></text>
</g>
</svg>