  <text x="180.27599999999995" y="66.9" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="180.27599999999995" dy="-3.9000000000000012">Category (Tier 1)</tspan><tspan x="180.27599999999995" dy="16.900000000000002">e.g., Advanced Calculus, Linear Algebra</tspan></text>
</g>
