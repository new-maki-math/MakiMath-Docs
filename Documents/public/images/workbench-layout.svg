<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 916.7759999999998 133.8" width="916.7759999999998" height="133.8" style="--bg:#1F1F1F;--fg:#CCCCCC;--line:#CCCCCC;--accent:#0078D4;--muted:#CCCCCCCC;--surface:#181818;--border:#CCCCCC;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<polyline class="edge" data-from="Tree" data-to="Editor" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="选择小节" points="200.51,66.9 353.68,66.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Editor" data-to="Preview" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="实时编译" points="535.679,66.9 688.8489999999999,66.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<g class="edge-label" data-from="Tree" data-to="Editor" data-label="选择小节">
  <rect x="244.50999999999996" y="50.90000000000001" width="65.17" height="30.3" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="277.09499999999997" y="66.05000000000001" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.8499999999999996">选择小节</text>
</g>
<g class="edge-label" data-from="Editor" data-to="Preview" data-label="实时编译">
  <rect x="579.679" y="50.90000000000001" width="65.17" height="30.3" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="612.264" y="66.05000000000001" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.8499999999999996">实时编译</text>
</g>
<g class="node" data-id="Tree" data-label="左侧：目录树导航
(WorkbenchTree)" data-shape="rectangle">
  <rect x="40" y="40" width="160.51" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="120.255" y="66.9" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="120.255" dy="-3.9000000000000012">左侧：目录树导航</tspan><tspan x="120.255" dy="16.900000000000002">(WorkbenchTree)</tspan></text>
</g>
<g class="node" data-id="Editor" data-label="中间：Typst 源码编辑
(MCodeEditor)" data-shape="rectangle">
  <rect x="353.68" y="40" width="181.99899999999997" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="444.67949999999996" y="66.9" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="444.67949999999996" dy="-3.9000000000000012">中间：Typst 源码编辑</tspan><tspan x="444.67949999999996" dy="16.900000000000002">(MCodeEditor)</tspan></text>
</g>
<g class="node" data-id="Preview" data-label="右侧：WASM 实时预览
(TypstDoc)" data-shape="rectangle">
  <rect x="688.8489999999999" y="40" width="187.92699999999996" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="782.8124999999999" y="66.9" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="782.8124999999999" dy="-3.9000000000000012">右侧：WASM 实时预览</tspan><tspan x="782.8124999999999" dy="16.900000000000002">(TypstDoc)</tspan></text>
</g>
</svg>