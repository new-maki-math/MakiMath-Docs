<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1189.3629999999998 193.8" width="1189.3629999999998" height="193.8" style="--bg:#1F1F1F;--fg:#CCCCCC;--line:#CCCCCC;--accent:#0078D4;--muted:#CCCCCCCC;--surface:#181818;--border:#CCCCCC;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<g class="subgraph" data-id="Client" data-label="Client (Vue)">
  <rect x="40" y="40" width="419.54499999999996" height="113.80000000000001" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="40" y="40" width="419.54499999999996" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="52" y="54" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">Client (Vue)</text>
</g>
<g class="subgraph" data-id="Network" data-label="Network Transit">
  <rect x="519.545" y="48.45" width="181.395" height="96.9" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="519.545" y="48.45" width="181.395" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="531.545" y="62.45" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">Network Transit</text>
</g>
<g class="subgraph" data-id="Server" data-label="Fastify Server">
  <rect x="760.9399999999999" y="40" width="388.423" height="113.80000000000001" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="760.9399999999999" y="40" width="388.423" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="772.9399999999999" y="54" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">Fastify Server</text>
</g>
<polyline class="edge" data-from="ClientInterceptor" data-to="HTTPS" data-style="solid" data-arrow-start="true" data-arrow-end="true" points="443.54499999999996,110.9 535.545,110.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" marker-start="url(#arrowhead-start)" />
<polyline class="edge" data-from="HTTPS" data-to="ServerMiddleware" data-style="solid" data-arrow-start="true" data-arrow-end="true" points="684.9399999999999,110.9 776.9399999999999,110.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" marker-start="url(#arrowhead-start)" />
<polyline class="edge" data-from="UI" data-to="ClientInterceptor" data-style="solid" data-arrow-start="true" data-arrow-end="true" points="196.503,110.9 244.503,110.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" marker-start="url(#arrowhead-start)" />
<polyline class="edge" data-from="ServerMiddleware" data-to="Route" data-style="solid" data-arrow-start="true" data-arrow-end="true" points="952.27,110.9 1000.27,110.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" marker-start="url(#arrowhead-start)" />
<g class="node" data-id="UI" data-label="Vue Components
(Domain Models)" data-shape="rectangle">
  <rect x="56" y="84" width="140.503" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="126.2515" y="110.9" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="126.2515" dy="-3.9000000000000012">Vue Components</tspan><tspan x="126.2515" dy="16.900000000000002">(Domain Models)</tspan></text>
</g>
<g class="node" data-id="ClientInterceptor" data-label="Request Interceptor
(Serialization &amp; Packaging)" data-shape="rectangle">
  <rect x="244.503" y="84" width="199.042" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="344.024" y="110.9" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="344.024" dy="-3.9000000000000012">Request Interceptor</tspan><tspan x="344.024" dy="16.900000000000002">(Serialization &amp; Packaging)</tspan></text>
</g>
<g class="node" data-id="HTTPS" data-label="HTTPS Transport" data-shape="rectangle">
  <rect x="535.545" y="92.45" width="149.395" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="610.2425" y="110.9" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">HTTPS Transport</text>
</g>
<g class="node" data-id="ServerMiddleware" data-label="Server Middleware
(Verification &amp; Parsing)" data-shape="rectangle">
  <rect x="776.9399999999999" y="84" width="175.32999999999998" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="864.6049999999999" y="110.9" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="864.6049999999999" dy="-3.9000000000000012">Server Middleware</tspan><tspan x="864.6049999999999" dy="16.900000000000002">(Verification &amp; Parsing)</tspan></text>
</g>
<g class="node" data-id="Route" data-label="Route Handlers
(Domain Logic)" data-shape="rectangle">
  <rect x="1000.27" y="84" width="133.09300000000002" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="1066.8165" y="110.9" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="1066.8165" dy="-3.9000000000000012">Route Handlers</tspan><tspan x="1066.8165" dy="16.900000000000002">(Domain Logic)</tspan></text>
</g>
</svg>